const tag=k=>{const t=TRAZA[k];return t?`<span class="tag t-${t[0].replace("*","x")}" title="${esc(t[1])}">${t[0]}</span>`:""};

 ["valor","Valor del patrimonio","valor"],["antig","Antigüedad del fideicomiso","antig"],

function esAux(v){return String(v||"").indexOf("Entidad auxiliar")===0;}
function normTP(v){v=String(v||"");if(v==="PF nacional")return "Persona física";if(v==="PM nacional"||v==="PM extranjera")return "Persona moral";return v;}
function esPF(p){const v=normTP(p.tipoPersona);return v==="Persona física"||v.indexOf("PF")===0;}
function catEdad(p){return esPF(p)?"edadPF":"edad";}
function effInt(p){const s=scoreInt(p);if(p.lista)return 500;
  if(p.pep||p.bc||esAux(p.actividad))return Math.max(s,291);return s;}
function lvl(cat,val){const f=CAT[cat].find(x=>x[0]===val);return f?f[1]:1;}
function banda(s){return s>=291?"ALTO":s>=259?"MEDIO ALTO":s>=224?"MEDIO":"BAJO";}
function cls(b){return "b-"+b.replace(/\s/g,"");}
function proxRev(b,fecha){const M={"PROHIBITIVO":6,"ALTO":6,"MEDIO ALTO":12,"MEDIO":24,"BAJO":36}[b]||12;
  const d=fecha?new Date(fecha+"T12:00:00"):new Date();d.setMonth(d.getMonth()+M);return d.toISOString().slice(0,10);}
function partesLvl(n){return n<=3?1:n<=6?2:n<=10?3:5;}

let FILTRO="";

  authDomain:"calificador-fiduciario.firebaseapp.com",
  projectId:"calificador-fiduciario",

/* Nube activada — proyecto Firebase: calificador-fiduciario.
Requiere en la consola Firebase: Authentication → Email/contraseña con los usuarios del equipo,
y Firestore con reglas: allow read, write: if request.auth != null (colección fideicomisos). */
let MODO="local",USER=null,DB=null,UNSUB=null,NUBE_MSG="";
function fbScript(src){return new Promise((res,rej)=>{const s=document.createElement("script");
  s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}
function regKey(r){const b=String(r.id||"").replace(/[^\w.-]+/g,"_");return b||("SINID_"+(r.fecha||"")+"_"+Math.random().toString(36).slice(2,8));}
async function initNube(){
  if(!FB_CONFIG)return;
  MODO="cargando";
  try{
    const v="10.12.2",u="https://www.gstatic.com/firebasejs/"+v+"/";
    await fbScript(u+"firebase-app-compat.js");
    await fbScript(u+"firebase-auth-compat.js");
    await fbScript(u+"firebase-firestore-compat.js");
    firebase.initializeApp(FB_CONFIG);DB=firebase.firestore();
    firebase.auth().onAuthStateChanged(usr=>{
      USER=usr||null;
      if(UNSUB){UNSUB();UNSUB=null;}
      if(USER){MODO="nube";NUBE_MSG="";
        UNSUB=DB.collection("fideicomisos").orderBy("fecha","desc").onSnapshot(snap=>{
          REG=snap.docs.map(d=>{const x=d.data();x.key=d.id;return x;});render();},
          err=>{NUBE_MSG="Sin acceso a la base: revise las reglas de Firestore.";render();});}
      else{MODO="login";}
      render();});
  }catch(e){MODO="local";NUBE_MSG="No se pudo cargar Firebase aquí; trabajando en modo local.";render();}
}
async function nubeSave(reg,msg){
  try{const k=reg.key||regKey(reg);reg.key=k;
    const hist={fecha:reg.fecha,final:reg.final,banda:reg.banda,por:USER?USER.email:""};
    await DB.collection("fideicomisos").doc(k).set(
      Object.assign({},reg,{historial:firebase.firestore.FieldValue.arrayUnion(hist)}),{merge:true});
    if(msg)toast(msg);}
  catch(e){toast("No se pudo guardar en la nube: "+(e&&e.code?e.code:"error")+".");}
}
async function nubeDelete(key){try{await DB.collection("fideicomisos").doc(key).delete();}
  catch(e){toast("No se pudo eliminar en la nube.");}}
async function loginNube(){
  const em=document.getElementById("lg-em"),pw=document.getElementById("lg-pw");

// ---------- Cálculo ----------
function scoreInt(p){let s=0;for(const k in W_FI){const cat=k==="edad"?catEdad(p):((k==="paisNac"||k==="nacionalidad"||k==="paisDom")?"pais":(k==="estadoDom"?"estado":k));const v=k==="tipoPersona"?normTP(p[k]):p[k];s+=lvl(cat,v)*W_FI[k];}return Math.round(s);}
function scoreEstr(f){let s=0;
  for(const[k,,cat]of FF_DEF)s+=lvl(cat,f[k])*W_FF[k];
  s+=partesLvl(f.integrantes.length)*W_FF.partes;return Math.round(s);}
function calcula(f){
  const ints=f.integrantes.map(p=>({...p,score:effInt(p)}));
  const estr=scoreEstr(f);
  // Ponderación POR GRUPO DE ROL: promedia dentro del rol, luego pondera el rol.
  const g={};ints.forEach(p=>{(g[p.rol]=g[p.rol]||[]).push(p.score)});
  const grupos=Object.keys(g).map(r=>({rol:r,n:g[r].length,
    prom:Math.round(g[r].reduce((a,b)=>a+b,0)/g[r].length),peso:W_ROL[r]||.15}));
  const sumW=grupos.reduce((a,x)=>a+x.peso,0)||1;
  grupos.forEach(x=>x.pesoN=x.peso/sumW);
  const pond=grupos.length?Math.round(grupos.reduce((a,x)=>a+x.prom*x.pesoN,0)):0;
  const peor=ints.length?Math.max(...ints.map(p=>p.score)):0;
  let base=Math.max(estr,pond);
  if(peor>=291)base=Math.max(base,peor);
  const hayB=ints.some(p=>p.lista);
  const hayAux=ints.some(p=>esAux(p.actividad))||esAux(f.actividadFid);
  const hayA=ints.some(p=>p.pep||p.bc)||hayAux;
  let bandaF,final=base,inval="";
  if(hayB){bandaF="PROHIBITIVO";final=500;inval="Invalidación tipo B: parte en lista de sanciones.";}
  else if(hayA){final=Math.max(base,291);bandaF=banda(final);
    inval="Invalidación tipo A: "+[ints.some(p=>p.pep)?"PEP":"",ints.some(p=>p.bc)?"BC no identificado":"",hayAux?"Entidad auxiliar del crédito (política interna)":""].filter(Boolean).join(" · ")+" — mínimo ALTO.";}
  else bandaF=banda(final);
  return{ints,estr,pond,peor,final,banda:bandaF,grupos,inval};
}

      T(M+9,y-12-ln*9,t.slice(0,cut),7.8,false,[45,55,72]);t=t.slice(cut).trim();ln++;}
    T(M+9,y-12-ln*9,"Fundamento: "+r.fun,7,false,GR);
    y-=30+ln*9-9;});
  y-=10;
  // detalle de integrantes
  const det=R.ints.slice().sort((a,b)=>b.score-a.score);
  tabla("Detalle de integrantes (mayor a menor riesgo)",
    ["#","Nombre","Rol","Tipo persona","Pais domicilio","Alertas","Puntaje","Banda"],
    [22,132,95,80,80,60,42,60],
    det.map((p,i)=>[i+1,p.nombre||"(sin nombre)",p.rol,p.tipoPersona,p.paisDom,
      [p.pep?"PEP":"",p.lista?"LISTA":"",p.bc?"BC":""].filter(Boolean).join(" ")||"-",
      "*"+p.score,banda(p.score)]));
  nueva();
  // ensamblar PDF
  const objs=[];
  const kids=pages.map((_,i)=>(4+i*2)+" 0 R").join(" ");
  objs.push("<< /Type /Catalog /Pages 2 0 R >>");
  objs.push("<< /Type /Pages /Kids ["+kids+"] /Count "+pages.length+" >>");
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  pages.forEach(c=>{
    objs.push("<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PW+" "+PH+"] /Resources << /Font << /F1 3 0 R /F2 "+(3+pages.length*2+1)+" 0 R >> >> /Contents "+(objs.length+2)+" 0 R >>");
    objs.push("<< /Length "+c.length+" >>\nstream\n"+c+"\nendstream");});
  objs.push("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  let out="%PDF-1.4\n";const off=[];
  objs.forEach((o,i)=>{off.push(out.length);out+=(i+1)+" 0 obj\n"+o+"\nendobj\n";});
  const xr=out.length;
  out+="xref\n0 "+(objs.length+1)+"\n0000000000 65535 f \n";
  off.forEach(o=>{out+=String(o).padStart(10,"0")+" 00000 n \n";});
  out+="trailer\n<< /Size "+(objs.length+1)+" /Root 1 0 R >>\nstartxref\n"+xr+"\n%%EOF";
  const u=new Uint8Array(out.length);
  for(let i=0;i<out.length;i++)u[i]=out.charCodeAt(i)&255;
  return u;
}

function bind(){
  document.querySelectorAll("[data-f]").forEach(el=>el.onchange=e=>{F[e.target.dataset.f]=e.target.value;render()});
  const id=document.getElementById("f-id"),nm=document.getElementById("f-nombre");
  id.oninput=e=>F.id=e.target.value; nm.oninput=e=>F.nombre=e.target.value;
  document.querySelectorAll("[data-i]").forEach(el=>{
    const i=+el.dataset.i,k=el.dataset.k;
    if(el.type==="checkbox")el.onchange=e=>{F.integrantes[i][k]=e.target.checked;render()};
    else if(el.tagName==="SELECT")el.onchange=e=>{const P=F.integrantes[i];P[k]=e.target.value;
      if(k==="tipoPersona"&&!CAT[catEdad(P)].some(x=>x[0]===P.edad))P.edad=esPF(P)?"25 a 50 años":"Más de 10 años";
      render()};
    else el.oninput=e=>{F.integrantes[i][k]=e.target.value};
  });
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{
    F.integrantes.splice(+b.dataset.del,1);render()});
  document.querySelectorAll("[data-delreg]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.delreg;
    if(MODO==="nube"){if(REG[i]&&REG[i].key)nubeDelete(REG[i].key);if(EDIT===i)EDIT=-1;return;}
    REG.splice(i,1);if(EDIT===i)EDIT=-1;else if(EDIT>i)EDIT--;guarda()});
  document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>{
    const i=+b.dataset.open;EDIT=i;F=JSON.parse(JSON.stringify(REG[i].fid));render();
    window.scrollTo({top:0,behavior:"smooth"});});
  document.getElementById("add").onclick=()=>{F.integrantes.push(nuevoInt());render()};
  document.getElementById("bulk").onclick=()=>{
    const n=Math.min(500,Math.max(1,+document.getElementById("bulkN").value||1));
    const rol=document.getElementById("bulkRol").value;
    const base=F.integrantes[F.integrantes.length-1]||nuevoInt();
    for(let i=0;i<n;i++)F.integrantes.push({...base,nombre:"",rol,pep:false,lista:false,bc:false});
    render();};
  document.getElementById("nuevo").onclick=()=>{F=nuevoFid();EDIT=-1;render()};
  document.getElementById("guardar").onclick=()=>{
    const R=calcula(F);
    const reg={id:F.id,nombre:F.nombre,nPartes:F.integrantes.length,estr:R.estr,pond:R.pond,
      peor:R.peor,final:R.final,banda:R.banda,fecha:new Date().toISOString().slice(0,10),
      fid:JSON.parse(JSON.stringify(F))};
    if(MODO==="nube"){
      if(EDIT>=0&&REG[EDIT])reg.key=REG[EDIT].key;
      const ant=EDIT>=0&&REG[EDIT]?REG[EDIT].final:null;EDIT=-1;F=nuevoFid();
      nubeSave(reg,ant!==null?("Actualizado en la nube. Antes "+ant+" → ahora "+reg.final+"."):"Guardado en la nube para todo el equipo.");render();}
    else if(EDIT>=0){const ant=REG[EDIT].final;REG[EDIT]=reg;EDIT=-1;F=nuevoFid();
      guarda("Actualizado. Antes "+ant+" → ahora "+reg.final+" ("+reg.banda+").");}
    else{REG.push(reg);F=nuevoFid();guarda("Guardado. Recuerde exportar el CSV al terminar.");}};
  document.getElementById("pdf").onclick=descargaPDF;
  const c=document.getElementById("csv");if(c)c.onclick=exportCSV;
  const l=document.getElementById("limpiar");if(l)l.onclick=()=>{
    if(confirm("¿Vaciar el registro de este navegador? No se puede deshacer."))
    {REG=[];guarda("Registro vacío.")}};
  const lg=document.getElementById("lg-go");
  if(lg){lg.onclick=loginNube;
    const pw=document.getElementById("lg-pw");
    if(pw)pw.onkeydown=e=>{if(e.key==="Enter")loginNube()};}
  const so=document.getElementById("salir");
  if(so)so.onclick=()=>{try{firebase.auth().signOut()}catch(e){}};
  const mg=document.getElementById("migrar");
  if(mg)mg.onclick=migraLocal;
  const bq=document.getElementById("buscar");
  if(bq){bq.onchange=e=>{FILTRO=e.target.value.trim();render()};}
  const qf=document.getElementById("qfiltro");
  if(qf)qf.onclick=()=>{FILTRO="";render()};
  document.getElementById("plantilla").onclick=plantillaCSV;
  document.getElementById("imp").onchange=importaCSV;
  const bk=document.getElementById("bkp");if(bk)bk.onclick=async()=>{
    await descarga("respaldo_fideicomisos_"+new Date().toISOString().slice(0,10)+".json",
      JSON.stringify(REG,null,1),"application/json");};
  document.getElementById("rest").onchange=e=>{
    const file=e.target.files&&e.target.files[0];if(!file)return;
    const rd=new FileReader();
    rd.onload=()=>{try{
      const arr=JSON.parse(String(rd.result));
      if(!Array.isArray(arr))throw 0;
      let nu=0,up=0;
      if(MODO==="nube"){arr.forEach(r=>{if(r&&r.fid){r.key=regKey(r);nubeSave(r);nu++}});
        toast("Respaldo enviado a la nube: "+nu+" fideicomisos.");}
      else{arr.forEach(r=>{if(!r||!r.fid)return;
        const i=REG.findIndex(x=>x.id&&r.id&&x.id===r.id);
        if(i>=0){REG[i]=r;up++}else{REG.push(r);nu++}});
      guarda("Respaldo restaurado: "+nu+" nuevos, "+up+" actualizados.");}
    }catch(err){toast("El archivo no es un respaldo válido.")}
    };
    rd.readAsText(file,"utf-8");
    e.target.value="";};
}

// ---------- Carga masiva ----------
const COLS=["ID","Fideicomiso","Tipologia","Patrimonio","Valor","AntiguedadFid","ActividadVulnerable",
 "Procedencia","USD","Desviacion","ActividadFideicomiso","NombreParte","Rol","TipoPersona","ActividadEconomica",
 "PaisNacimiento","Nacionalidad","PaisDomicilio","EstadoDomicilio","AntiguedadParte","PEP","Listas","BCsinIdentificar"];
const MAPF={Tipologia:"tipologia",Patrimonio:"patrimonio",Valor:"valor",AntiguedadFid:"antig",
 ActividadVulnerable:"av",Procedencia:"proc",USD:"usd",Desviacion:"desv"};
const MAPI={Rol:"rol",TipoPersona:"tipoPersona",ActividadEconomica:"actividad",PaisNacimiento:"paisNac",
 Nacionalidad:"nacionalidad",PaisDomicilio:"paisDom",EstadoDomicilio:"estadoDom",AntiguedadParte:"edad"};
function csvLine(a){return a.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(",")}
async function plantillaCSV(){
  const ej=nuevoFid(),p=nuevoInt("Fideicomitente");
  const fila=n=>[ "F/0001","Ejemplo traslativo",ej.tipologia,ej.patrimonio,ej.valor,ej.antig,ej.av,ej.proc,
    ej.usd,ej.desv,"No capturada",n,p.rol,p.tipoPersona,p.actividad,p.paisNac,p.nacionalidad,p.paisDom,p.estadoDom,p.edad,"NO","NO","NO"];
  const vals=["","VALORES VÁLIDOS POR COLUMNA (copie exactamente uno):","",
    ...Object.entries({Tipologia:"tipologia",Patrimonio:"patrimonio",Valor:"valor",AntiguedadFid:"antig",
      ActividadVulnerable:"av",Procedencia:"proc",USD:"usd",Desviacion:"desv",ActividadFideicomiso:"actFid",Rol:"rol",
      TipoPersona:"tipoPersona",ActividadEconomica:"actividad",PaisNacimiento:"pais",Nacionalidad:"pais",
      PaisDomicilio:"pais",EstadoDomicilio:"estado",AntiguedadParte:"edad"})
      .map(([c,k])=>c+": "+CAT[k].map(x=>x[0]).join(" | "))
      .concat(["AntiguedadParte si TipoPersona es PF (edad de la persona): "+CAT.edadPF.map(x=>x[0]).join(" | ")])];
  const csv="\ufeff"+[csvLine(COLS),csvLine(fila("Parte 1")),csvLine(fila("Parte 2"))].join("\r\n")
    +"\r\n"+vals.map(v=>csvLine([v])).join("\r\n");
  await descarga("plantilla_captura_fideicomisos.csv",csv,"text/csv");
}
function parseCSV(t){
  const rows=[];let f="",row=[],q=false;
  t=t.replace(/^\ufeff/,"");
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;
    else if(c===","){row.push(f);f=""}
    else if(c==="\n"){row.push(f);rows.push(row);row=[];f=""}
    else if(c!=="\r")f+=c;}
  if(f||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==""));
}
function valida(cat,v,def){const ok=CAT[cat].some(x=>x[0]===v);return ok?v:def}
function importaCSV(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const rows=parseCSV(String(rd.result));
      if(!rows.length)throw 0;
      const head=rows[0].map(x=>x.trim());
      const idx={};head.forEach((h,i)=>idx[h]=i);
      if(idx.ID===undefined||idx.Rol===undefined){toast("El CSV no tiene las columnas de la plantilla.");return}
      const porId={};let n=0;
      for(let r=1;r<rows.length;r++){
        const row=rows[r];const id=(row[idx.ID]||"").trim();
        if(!id||id.indexOf(":")>-1)continue;
        if(!porId[id]){
          const f=nuevoFid();f.integrantes=[];f.id=id;f.nombre=(row[idx.Fideicomiso]||"").trim();
          for(const col in MAPF){const k=MAPF[col];const cat=FF_DEF.find(x=>x[0]===k)[2];
            f[k]=valida(cat,(row[idx[col]]||"").trim(),f[k]);}
          if(idx.ActividadFideicomiso!==undefined)f.actividadFid=valida("actFid",(row[idx.ActividadFideicomiso]||"").trim(),f.actividadFid);
          porId[id]=f;
        }
        const p=nuevoInt();p.nombre=(row[idx.NombreParte]||"").trim();
        for(const col in MAPI){const k=MAPI[col];
          const cat=k==="edad"?catEdad(p):((k==="paisNac"||k==="nacionalidad"||k==="paisDom")?"pais":(k==="estadoDom"?"estado":k));
          if(k==="edad"&&!esPF(p)&&p.edad==="25 a 50 años")p.edad="Más de 10 años";
          let v=(row[idx[col]]||"").trim();if(k==="tipoPersona")v=normTP(v);
          p[k]=valida(cat,v,p[k]);}
        const si=v=>/^(s[ií]|si|x|1|true)$/i.test(String(v||"").trim());
        p.pep=si(row[idx.PEP]);p.lista=si(row[idx.Listas]);p.bc=si(row[idx.BCsinIdentificar]);
        porId[id].integrantes.push(p);n++;
      }
      const ids=Object.keys(porId);
      if(!ids.length){toast("No se encontraron filas con datos.");return}
      ids.forEach(id=>{const f=porId[id];const R=calcula(f);
        REG.push({id:f.id,nombre:f.nombre,nPartes:f.integrantes.length,estr:R.estr,pond:R.pond,
          peor:R.peor,final:R.final,banda:R.banda,fid:f});});
      guarda(ids.length+" fideicomisos cargados ("+n+" integrantes).");
    }catch(err){toast("No se pudo leer el archivo. Use la plantilla como base.")}
    e.target.value="";
  };
  rd.readAsText(file,"utf-8");
}

async function descarga(filename,data,mime){
  if(typeof claude!=="undefined"&&claude&&claude.use){
    const d=await claude.use("downloads");
    if(d){try{await d.save({filename,data});}catch(e){if(e&&e.code!=="declined")toast("No se pudo descargar.");}return;}
  }
  try{const b=new Blob([data],{type:mime});
    const u=URL.createObjectURL(b),a=document.createElement("a");
    a.href=u;a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},400);}
  catch(e){toast("No se pudo descargar.");}
}
function toast(m){const t=document.createElement("div");t.className="toast";t.textContent=m;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2600);}

async function exportCSV(){
  const hd=["ID","Fideicomiso","Partes","Estructural","Ponderado","PeorParte","Final","Banda","Actualizado","ProximaRevision"];
  const rows=REG.map(x=>[x.id,x.nombre,x.nPartes,x.estr,x.pond,x.peor,x.final,x.banda,x.fecha||"",proxRev(x.banda,x.fecha||null)]

}
